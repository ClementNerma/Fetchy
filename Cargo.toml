[package]
name = "fetchy"
version = "0.14.5"
edition = "2024"
description = "Quick packages installer"
license = "Apache-2.0"
repository = "https://github.com/ClementNerma/Fetchy"

[dependencies]
anyhow = "1.0.98"
bzip2 = "0.6.0"
clap = { version = "4.5.41", features = ["derive"] }
colored = "3.0.0"
comfy-table = "7.1.4"
dialoguer = { version = "0.11.0", default-features = false }
dirs = "6.0.0"
flate2 = "1.1.2"
indicatif = "0.18.0"
jiff = { version = "0.2.15", features = ["serde"] }
log = { version = "0.4.27", features = ["std"] }
openssl-sys = { version = "0.9.109", features = ["vendored"] }
parsy = { version = "0.15.4", features = ["error-reporting"] }
paste = "1.0.15"
rapidfuzz = "0.5.0"
regex = "1.11.1"
reqwest = "0.12.22"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tar = "0.4.44"
tempfile = "3.20.0"
tokio = { version = "1.46.1", features = ["fs", "macros", "rt-multi-thread"] }
xz = "0.1.0"
zip = { version = "4.3.0", default-features = false, features = [
    "deflate",
    "deflate64",
] }
